/* ── TOKENS ── */
:root,[data-theme="dark"]{
--bg:#111110;--surface:#181817;--surface-2:#1f1f1e;--surface-off:#252524;
--surface-dyn:#2e2d2c;--divider:#2a2928;--border:#373635;
--text:#e8e7e4;--muted:#8a8987;--faint:#5a5958;--inverse:#111110;

--shadow-lg:0 16px 40px rgba(0,0,0,.5);
--overlay:rgba(8,8,8,.8);
--ease:cubic-bezier(.16,1,.3,1);
--t:200ms;
--r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1.25rem;--r-full:9999px;
--font-d:'Space Grotesk',sans-serif;--font-b:'Inter',sans-serif;
}
[data-theme="light"]{

--n8n:#ea580c;--n8n-h:#c2410c;--n8n-l:#fff7ed;
--shadow-sm:0 1px 3px rgba(0,0,0,.08);
--shadow-md:0 4px 16px rgba(0,0,0,.12);
--shadow-lg:0 16px 40px rgba(0,0,0,.18);
--overlay:rgba(245,245,243,.85);
}
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-b);color:var(--text);background:var(--bg);min-height:100dvh;line-height:1.6}
img{display:block;max-width:100%}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:3px;border-radius:var(--r-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── SKIP LINK ── */
.skip-link{position:fixed;top:.75rem;left:.75rem;padding:.5rem 1rem;background:var(--primary);color:var(--inverse);font-size:.875rem;font-weight:600;border-radius:var(--r-md);z-index:9999;transform:translateY(-120%);transition:transform var(--t) var(--ease)}
.skip-link:focus{transform:translateY(0)}

/* ── GRID BG ── */
.grid-dots{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}

/* ── HEADER ── */
.site-header{position:fixed;top:0;left:0;right:0;z-index:500;height:64px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding-inline:1.5rem;transition:box-shadow var(--t)}
.site-header.scrolled{box-shadow:var(--shadow-md)}
.header-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin-inline:auto}
.logo-link{display:flex;align-items:center;gap:.75rem;transition:opacity var(--t)}
.logo-link:hover{opacity:.8}
.logo-mark{width:36px;height:36px;flex-shrink:0}
.logo-wordmark{font-family:var(--font-d);font-size:.875rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.logo-wordmark span{display:block;font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.header-right{display:flex;align-items:center;gap:.75rem}
.social-link{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-radius:var(--r-full);font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;min-height:36px;transition:background var(--t),color var(--t),box-shadow var(--t)}

.theme-toggle{width:40px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-full);color:var(--muted);background:var(--surface-off);transition:background var(--t),color var(--t)}

.burger-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:44px;height:44px;border-radius:var(--r-md);transition:background var(--t)}

.burger-btn[aria-expanded="true"] .burger-line-3{transform:translateY(-7px) rotate(-45deg)}
